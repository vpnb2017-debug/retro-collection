<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroCollection v129 📷🔍🎨🎮</title>

    <script>
        // Instant Theme Engine — zero flicker
        (function () {
            const saved = localStorage.getItem('app_theme') || 'amber';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e24">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- v129: Themes CSS with dynamic spinners and status bars -->
    <link rel="stylesheet" href="css/themes.css?v=129">

    <!-- Critical Styles Inlined -->
    <style>
        :root {
            --h-header: 60px;
            --h-bottom: 60px;
            --accent-color: #ff9f0a;
            --bg-app: #1e1e24;
            --bg-header: #18181e;
            --text-main: #ffffff;
            --text-muted: #ffc978;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, sans-serif;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            max-width: 100vw;
            background: var(--bg-app);
            color: var(--text-main);
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        #app {
            display: grid;
            grid-template-rows: var(--h-header) 1fr;
            height: 100vh;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
        }

        .main-header {
            background: var(--bg-header);
            border-bottom: 2px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 2000;
        }

        #main-content {
            display: grid;
            grid-template-rows: auto auto 1fr;
            background: var(--bg-app);
            overflow-x: hidden;
            overflow-y: hidden;
            width: 100%;
            max-width: 100vw;
            position: relative;
        }

        .v29-title-zone,
        .v29-filter-zone,
        .v29-scroll-zone {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .v29-title-zone {
            padding: 15px 20px 5px 20px;
            background: var(--bg-app);
        }

        .v29-filter-zone {
            padding: 5px 20px 10px 20px;
            background: var(--bg-app);
        }

        .v29-scroll-zone {
            overflow-y: auto !important;
            overflow-x: hidden;
            padding: 10px 20px 100px 20px;
            -webkit-overflow-scrolling: touch;
            background: var(--bg-app);
        }

        /* Filter Controls Responsive Rules */
        .filter-controls-row {
            display: flex;
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .filter-controls-row select {
            min-width: 0;
            flex: 1 1 0;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .search-controls-row {
            display: flex;
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
            align-items: center;
        }

        .search-controls-row input {
            min-width: 0;
            flex: 1 1 0;
            box-sizing: border-box;
        }

        @media (max-width: 600px) {
            #app {
                grid-template-rows: var(--h-header) 1fr var(--h-bottom);
            }

            .main-header {
                padding: 0 14px;
            }

            .v29-title-zone {
                padding: 12px 14px 4px 14px;
            }

            .v29-filter-zone {
                padding: 4px 14px 8px 14px;
            }

            .v29-scroll-zone {
                padding: 8px 14px 120px 14px !important;
            }

            .bottom-nav {
                display: flex !important;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: var(--h-bottom);
                background: var(--bg-header);
                border-top: 1px solid var(--border-color, rgba(255, 159, 10, 0.2));
                align-items: center;
                justify-content: space-around;
                z-index: 2000;
            }

            .desktop-nav {
                display: none !important;
            }
        }

        @media (max-width: 480px) {
            .filter-controls-row {
                flex-wrap: wrap;
            }

            .filter-controls-row select {
                flex: 1 1 45%;
                font-size: 0.8rem !important;
                padding: 8px !important;
            }

            .filter-controls-row select#f-validation {
                flex: 1 1 100%;
            }
        }

        .logo h1 {
            font-size: 1.25rem;
            color: var(--accent-color);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .desktop-nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            margin-left: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .desktop-nav button.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-color);
        }

        .btn-new {
            background: var(--accent-gradient, linear-gradient(135deg, #ff9f0a 0%, #ff7950 100%));
            color: white !important;
            padding: 8px 18px !important;
            border-radius: 20px !important;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-new:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px var(--accent-subtle, rgba(255, 159, 10, 0.4));
        }

        /* Error Overlay */
        #error-display {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        /* Loading Diagnostics */
        #loading-log {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            color: #aaa;
            z-index: 9000;
            border: 1px solid #333;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            display: none;
        }

        /* Floating Action Button for Mobile */
        .fab-mobile {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: var(--accent-gradient, linear-gradient(135deg, #ff9f0a 0%, #ff7950 100%));
            color: white;
            border-radius: 30px;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 4px 15px var(--accent-subtle, rgba(255, 159, 10, 0.4));
            z-index: 3000;
            border: 2px solid var(--bg-header);
            cursor: pointer;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .fab-mobile {
                display: flex;
            }
        }

        /* Form Optimization v74 */
        .v74-form-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .v74-form-row {
                flex-direction: column;
                gap: 16px;
            }

            input,
            select,
            textarea {
                font-size: 16px !important;
                /* Prevent iOS zoom */
            }

            .v74-btn-group {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/shelf.css?v=127">
</head>

<body>
    <style>
        /* v108.1: Scrollbar Forçada */
        ::-webkit-scrollbar {
            width: 8px !important;
            height: 8px !important;
        }

        ::-webkit-scrollbar-track {
            background: rgba(30, 30, 36, 0.5) !important;
            border-radius: 10px !important;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color, rgba(255, 159, 10, 0.3)) !important;
            border-radius: 10px !important;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color, rgba(255, 159, 10, 0.6)) !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--border-color, rgba(255, 159, 10, 0.3)) rgba(30, 30, 36, 0.5) !important;
        }
    </style>
    <div id="error-display">
        <h2 style="color:#ff4d4d; margin-bottom: 1rem;">Ocorreu um Erro ☠️</h2>
        <div id="error-content"
            style="font-family: monospace; background: #000; padding: 1rem; border-radius: 8px; width: 100%; max-width: 600px; overflow: auto; margin-bottom: 1rem; text-align: left; font-size: 0.8rem;">
        </div>
        <button onclick="location.reload()"
            style="padding: 10px 20px; border-radius: 8px; border: none; background: var(--accent-color, #ff9f0a); color: white; font-weight: bold; cursor: pointer;">Tentar
            Novamente</button>
    </div>

    <div id="loading-log"></div>
    <div id="emergency-zone"
        style="position:fixed; bottom:160px; left:20px; right:20px; z-index:9500; text-align:center; display:none;">
        <button id="emergency-btn"
            style="background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#ef4444; padding:12px 20px; border-radius:12px; font-weight:700; font-size:0.8rem; cursor:pointer; backdrop-filter:blur(5px);">
            ⚠️ Nada acontece? Clique aqui (RESET TOTAL)
        </button>
    </div>

    <div id="app">
        <header class="main-header">
            <div class="logo">
                <h1>RetroCollection</h1>
            </div>
            <nav class="desktop-nav">
                <button onclick="navigate('nav-dashboard')">Resumo</button>
                <button onclick="navigate('nav-collection')">Coleção</button>
                <button onclick="navigate('nav-platforms')">Consolas</button>
                <button onclick="navigate('nav-sync')">Nuvem</button>
                <button class="btn-new" onclick="openAddModal()">+ Novo</button>
            </nav>
        </header>

        <main id="main-content">
            <div class="v29-title-zone">
                <h2>A carregar...</h2>
            </div>
            <div class="v29-filter-zone"></div>
            <div class="v29-scroll-zone"></div>
        </main>

        <nav class="bottom-nav" style="display:none;">
            <button onclick="navigate('nav-dashboard')"
                style="background:none; border:none; font-size:1.5rem;">🏠</button>
            <button onclick="navigate('nav-collection')"
                style="background:none; border:none; font-size:1.5rem;">🎮</button>
            <button onclick="navigate('nav-platforms')"
                style="background:none; border:none; font-size:1.5rem;">🕹️</button>
            <button onclick="navigate('nav-sync')" style="background:none; border:none; font-size:1.5rem;">☁️</button>
        </nav>

        <button class="fab-mobile" onclick="openAddModal()">+</button>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- v123: jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // LOGGING TOOL
        function log(msg) {
            const logEl = document.getElementById('loading-log');
            if (logEl) {
                logEl.style.display = 'block';
                const now = new Date().toLocaleTimeString();
                logEl.innerHTML += `<div>[${now}] ${msg}</div>`;
                logEl.scrollTop = logEl.scrollHeight;
            }
            console.log("APP LOG:", msg);
        }

        // GLOBAL ERROR HANDLER
        window.onerror = function (msg, url, line, col, error) {
            const display = document.getElementById('error-display');
            const content = document.getElementById('error-content');
            if (display && content) {
                display.style.display = 'flex';
                content.innerText = `${msg}\nLocal: ${line}:${col}\nFicheiro: ${url}\n\nStack: ${error ? error.stack : 'N/A'}`;
            }
            return false;
        };

        log("Arranque v127 iniciado...");

        // v127 AGGRESSIVE SETUP & UPDATE
        const urlParams = new URLSearchParams(window.location.search);
        const currentV = urlParams.get('v');
        const forceUpdate = urlParams.get('update');

        if (localStorage.getItem('app_v') !== '129' || forceUpdate === '129' || (currentV && currentV !== '129')) {
            log("Actualização Crítica v129...");
            localStorage.setItem('app_v', '129');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(rs => {
                    Promise.all(rs.map(r => r.unregister())).then(() => {
                        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
                            log("Cache renovado. A reiniciar...");
                            location.href = location.href.split('?')[0] + '?v=129';
                        });
                    });
                });
            } else {
                location.href = location.href.split('?')[0] + '?v=129';
            }
        }

        // Hanging check v129 + Emergency Button
        setTimeout(() => {
            const title = document.querySelector('.v29-title-zone h2');
            if (title && title.innerText.includes('A carregar')) {
                log("Aviso: O arranque está a demorar muito...");
                const ez = document.getElementById('emergency-zone');
                if (ez) ez.style.display = 'block';
            }
        }, 8000);

        // Emergency Reset Logic
        document.getElementById('emergency-btn').onclick = async () => {
            if (confirm("Isto irá limpar o cache e desinstalar a App para tentar resolver o problema. Continuar?")) {
                localStorage.removeItem('app_v');
                localStorage.removeItem('logos_synced_v129');
                localStorage.removeItem('logos_synced_v128');
                localStorage.removeItem('logos_synced_v127');
                localStorage.removeItem('logos_synced_v126');
                localStorage.removeItem('logos_synced_v125');
                localStorage.removeItem('logos_synced_v124');
                localStorage.removeItem('logos_synced_v123');
                if ('serviceWorker' in navigator) {
                    const rs = await navigator.serviceWorker.getRegistrations();
                    for (let r of rs) await r.unregister();
                }
                const keys = await caches.keys();
                for (let k of keys) await caches.delete(k);
                location.href = location.href.split('?')[0] + '?update=129';
            }
        };
    </script>

    <script type="module" src="js/app.js?v=129"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=129')
                    .then((registration) => {
                        log("v129 Pronta.");
                        console.log('SW registered:', registration);
                    })
                    .catch(e => {
                        log("SW Falhou (App continua a funcionar): " + e.message);
                        console.warn('SW registration failed (app will work without offline support):', e);
                    });
            });
        }
    </script>
</body>
